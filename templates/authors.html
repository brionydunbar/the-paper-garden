<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Paper Garden | The Literary Corner</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <header class="site-header">
            <nav class="site-nav" aria-label="Main navigation">
                <a href="/" class="logo">The Paper Garden ♡</a>
                <div class="nav-links">
                    <a href="/books">Books</a>
                    <a href="/authors" aria-current="page">Authors</a>
                    <a href="/quotes">Quotes</a>
                    <a href="/films">Films</a>
                    <a href="/users/new">Sign Up</a>
                    <a href="/sessions/new">Log In</a>
                </div>
            </nav>
        </header>
        <main>
            <h1 class="page-header">Author directory</h1>
            <p class="subtitle">Creators of adventures.</p>
            <section aria-label="Authors collection">
                <ul class="content-list">
                    {% for author in authors %}
                        <li>{{ author }}</li>
                    {% endfor %}
                </ul>
            </section>
        </main>
    </body>
</html>
