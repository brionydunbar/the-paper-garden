<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Paper Garden | The Literary Corner</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <header class="site-header">
            <nav class="site-nav" aria-label="Main navigation">
                <a href="/" class="logo">The Paper Garden ♡</a>
                <div class="nav-links">
                    <a href="/books" aria-current="page">Books</a>
                    <a href="/authors">Authors</a>
                    <a href="/quotes">Quotes</a>
                    <a href="/films">Films</a>
                    <a href="/users/new">Sign Up</a>
                    <a href="/sessions/new">Log In</a>
                </div>
            </nav>
        </header>

        <main class="book-store">

            <h1 class="page-header">My Bookshelf</h1>
            <p class="subtitle">A collection of stories to get lost in.</p>
            <section aria-label="My book collection">
                <ul class="content-list">
                    {% for book in books %}
                        <li>{{ book }}</li>
                    {% endfor %}
                </ul>
            </section>

            <section class="form" aria-labelledby="add-book-heading">
                <h2 id="add-book-heading">Add to the bookshelf</h2>
                <p>Found a new favourite? Add it to the collection.</p>
                <form method="POST" action="/books">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="e.g. The Secret Garden" required><br>
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" placeholder="e.g. Frances Hodgson Burnett" required><br>
                    <button type="submit">Add book</button>
                </form>
            </section>
        </main>
    </body>
</html>
